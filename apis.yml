name: Screenhero
description: Screenhero was a Y Combinator (W13) startup that built interactive screen
  sharing with voice and video, letting remote users share and control any application
  together. It was acquired by Slack in January 2015; the six-person team joined Slack
  and the standalone Screenhero product was discontinued, with its screen-sharing,
  voice, and video capabilities folded into Slack (today surfaced as Slack Huddles).
  The screenhero.com domain now 301-redirects to slack.com/features/huddles. No independent
  Screenhero developer portal, API, or SDK exists; this record is retained as a historical
  a16z portfolio-company lead in the API Evangelist network.
